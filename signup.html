<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="container">
        <div class="left">
            <h3 id="signin">Sign up</h3>
            <input type="text" placeholder="Full name">
            <input type="email" name="" id="email" placeholder="Email address">
            <input type="password" name="" id="pwd" placeholder="password">
            <button id="login-btn">Sign up</button>
        </div>
        <div class="right">
            <div class="image-part">
                <img src="./assets/images/sign-up-animate.svg" alt="">
            </div>
            <div class="info">
                <h3>Hello!, Please tell us a bit about yourself</h3>
                <p>By creating an account, you agree to the <a href="" id="terms">Terms & Conditions</a></p>
                <a href="./login.html"><button>Already have an account? Sign in</button></a>
            </div>
        </div>
    </div>
</body>

</html>
